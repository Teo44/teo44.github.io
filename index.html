<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teo photography</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="style.css">
  <noscript><style>img[data-src] { display: none; }</style></noscript>
  <script src="insects.js" defer></script>
</head>
<body>
  <header>
    <h1>Teo photography</h1>
  </header>

  <main>
    <section class="gallery">
      <!-- Photos are grouped into rows of 3; insects.js rebuilds the rows from the visible
           photos, so the grouping here only matters without JavaScript. --ratio is the image's
           width/height; it keeps every image in a row the same height. Insect photos are marked
           with data-insect and use data-src, so they only load once the visitor agrees. -->
      <div class="gallery-row">
        <a href="photos/summer-chafer.html" data-insect style="--ratio: 2000 / 1333">
          <img data-src="images/amphimallon_solstitiale_040725_preview.jpg" alt="Summer chafer on fence post" width="2000" height="1333">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
        <a href="photos/lymantria-dispar.html" data-insect style="--ratio: 1500 / 2000">
          <img data-src="images/lymantria_dispar_dispar_050826_preview.jpg" alt="Lymantria dispar dispar showing his antennae" width="1500" height="2000">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
        <a href="photos/moose.html" style="--ratio: 2000 / 1236">
          <img src="images/moose_161026_preview.jpg" alt="My first moose sighting" width="2000" height="1236">
        </a>
      </div>
      <div class="gallery-row">
        <a href="photos/cepaea-nemoralis.html" data-insect style="--ratio: 2000 / 1331">
          <img data-src="images/20220910_0223_Cepaea_nemoralis_preview.jpg" alt="Grove snail on a fence post" width="2000" height="1331">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
        <a href="photos/araneus-diadematus.html" data-insect style="--ratio: 2000 / 1414">
          <img data-src="images/20220913_0060_Araneus_diadematus_preview.jpg" alt="Cross orbweaver in its web" width="2000" height="1414">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
        <a href="photos/tokay-gecko.html" style="--ratio: 2000 / 1333">
          <img src="images/gekko_gecko_120922_preview.jpg" alt="Tokay gecko peeking out of a ceiling lamp" width="2000" height="1333">
        </a>
      </div>
      <div class="gallery-row">
        <a href="photos/hydnum-repandum.html" style="--ratio: 2000 / 1331">
          <img src="images/hydnum_repandum_161026_preview.jpg" alt="Close-up of the tooth-like spines under a Hydnum repandum cap" width="2000" height="1331">
        </a>
        <a href="photos/argiope.html" data-insect style="--ratio: 2000 / 1333">
          <img data-src="images/argiope_2022.11.18_preview.jpg" alt="Female St Andrew's cross spider in its web" width="2000" height="1333">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
        <a href="photos/cicada.html" data-insect style="--ratio: 2000 / 1342">
          <img data-src="images/cicada_2022.11.25_preview.jpg" alt="Head-on close-up of a green cicada's face" width="2000" height="1342">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
      </div>
      <div class="gallery-row">
        <a href="photos/mantis-religiosa.html" data-insect style="--ratio: 2000 / 1333">
          <img data-src="images/mantis_religiosa_2023.09.02_preview.jpg" alt="European mantis peeking out from behind dry grass stems" width="2000" height="1333">
          <noscript><span class="insect-placeholder">Insect close-up – click to view</span></noscript>
        </a>
      </div>
    </section>
  </main>

  <dialog id="insect-dialog">
    <form method="dialog">
      <p>Some of these photos are close-ups of insects. Would you like to see them?</p>
      <button value="yes">Show insects</button>
      <button value="no">Hide insects</button>
    </form>
  </dialog>

  <footer>
    <p>&copy; 2026 Teo</p>
    <button id="insect-toggle" class="link-button" hidden></button>
  </footer>
</body>
</html>
