<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cicada – Teo photography</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="../style.css">
  <noscript><style>img[data-src] { display: none; }</style></noscript>
  <script src="../insects.js" defer></script>
</head>
<body>
  <header>
    <h1><a href="../index.html">Teo photography</a></h1>
  </header>

  <main class="photo">
    <div class="photo-frame">
      <a class="photo-full" href="../images/cicada_2022.11.25.png">
        <img data-src="../images/cicada_2022.11.25.png" data-insect alt="Head-on close-up of a green cicada's face" width="4860" height="3262">
        <noscript><img src="../images/cicada_2022.11.25.png" alt="Head-on close-up of a green cicada's face" width="4860" height="3262"></noscript>
      </a>
      <p class="photo-details">Nikon D500 · Laowa 100mm Macro @ 100mm · f/11 · 1/160 s · ISO 320 · November 2022 · Bali, Indonesia</p>
    </div>
    <p class="photo-caption">The song of the cicadas might get on the nerves of some, but how could you remain angry at those eyes.</p>
  </main>

  <dialog id="insect-dialog" data-decline-url="../index.html">
    <form method="dialog">
      <p>This photo is a close-up of an insect. Would you like to see it?</p>
      <button value="yes">Show photo</button>
      <button value="no">Back to gallery</button>
    </form>
  </dialog>

  <footer>
    <p>&copy; 2026 Teo</p>
  </footer>
